server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php index.html index.htm;
    port_in_redirect off;

    client_max_body_size 16M;

    # Security: Deny direct HTTP access to SQLite database & messages log
    location ^~ /storage/ {
        deny all;
        return 404;
    }

    # Security: Deny access to hidden dotfiles (.git, .env, .htaccess)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Security: In uploads directory, serve static media only (prevent script execution)
    location ^~ /uploads/ {
        location ~ \.php$ {
            deny all;
            return 403;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # FastCGI execution for PHP
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }
}
